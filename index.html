<script>
  // 첫 화면 깜빡임 없이 테마·언어를 먼저 정한다: URL(?lang=) > 저장값 > 브라우저 설정
  (function () {
    var root = document.documentElement, theme, lang;
    try { theme = localStorage.getItem('theme'); lang = localStorage.getItem('lang'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'ko' || q === 'en') lang = q;
    if (lang !== 'ko' && lang !== 'en') lang = (navigator.language || 'ko').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
    root.setAttribute('data-theme', theme);
    root.setAttribute('lang', lang);
  })();

<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --surface-2: #f1f1f3;
    --text: #18181b; --text-2: #3f3f46; --muted: #71717a;
    --border: #e4e4e7; --border-strong: #d4d4d8;
    --accent: #0b7a54; --on-accent: #ffffff;
    --accent-soft: rgba(11, 122, 84, .07); --accent-border: rgba(11, 122, 84, .28);
    --header-bg: rgba(250, 250, 249, .82);
    --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;

    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", monospace;
    color-scheme: light;

  :root[data-theme="dark"] {
    --bg: #0c0e10; --surface: #121518; --surface-2: #1b1e22;
    --text: #e8e8eb; --text-2: #c3c3cb; --muted: #8b8d96;
    --border: #23272c; --border-strong: #30353b;
    --accent: #3ddc97; --on-accent: #06140e;

  .contact .item { display: inline-flex; align-items: center; gap: 7px; }

  .section-label { font: 500 12.5px var(--font-mono); color: var(--accent); margin: 0 0 6px; }

  .value p { margin: 0; color: var(--text-2); font-size: 15px; }

  /* skills */
  .skills { display: grid; gap: 14px; }
  .skill-row { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: baseline; }
  .skill-name { font: 500 13px var(--font-mono); color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font: 500 12.5px var(--font-mono); line-height: 1.6; padding: 2px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
  .tag.primary { color: var(--accent); border-color: var(--accent-border); background: var(--accent-soft); }
  .legend { display: flex; align-items: center; gap: 8px; font: 12px var(--font-mono); color: var(--muted); margin: 18px 0 0; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--accent-border); background: var(--accent-soft); }

  /* experience */
  .company + .company { margin-top: 52px; }
  .company-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .company-name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }

  .project { position: relative; padding-bottom: 30px; }
  .project:last-child { padding-bottom: 4px; }
  .project::before { content: ""; position: absolute; left: -30px; top: 8px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .p-title { font-size: 17px; font-weight: 700; line-height: 1.45; letter-spacing: -0.015em; margin: 0; }
  .chip { font: 500 11.5px var(--font-mono); color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-border); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }

  @media screen and (max-width: 760px) {

  @media print {

    .stat { padding: 8px 10px; border-radius: 6px; }
    .stat-num { font-size: 15pt; }
    .stat-label { font-size: 8pt; margin-top: 2px; }
    .section { margin-top: 18px; }
    .section-label { margin-bottom: 2px; }
    .section-title { font-size: 14pt; margin-bottom: 8px; }
    .lead { font-size: 9.6pt; margin-bottom: 8px; }
    .highlights { margin-bottom: 10px; }
    .highlights li { padding: 6px 10px; font-size: 9pt; border-radius: 6px; }
    .value h3 { font-size: 10pt; margin-bottom: 2px; }
    .value p { font-size: 9pt; }
    .skills { gap: 6px; }
    .tag { font-size: 8pt; padding: 0 6px; }
    .legend { margin-top: 8px; }
    .company + .company { margin-top: 16px; }
    .company-head { padding-bottom: 6px; }
    .company-name { font-size: 12.5pt; }
    .company-desc { margin-top: 4px; font-size: 9pt; }
    .timeline { margin-top: 10px; }
    .project { padding-bottom: 10px; }
    .project::before { top: 5px; }
    .p-title { font-size: 10.5pt; }
    .p-period { font-size: 8.5pt; margin-top: 0; }
    .p-summary { font-size: 9.2pt; margin-top: 3px; }

    /* grid 목록은 페이지 경계에서 통째로 밀려나므로 인쇄 때는 block으로 */

    .edu-row { padding: 6px 0; }
    .p-top, .company-head, .section-label, .section-title { break-after: avoid; page-break-after: avoid; }
    .p-top, .company-head, .bullets li, .stat, .highlights li, .skill-row, .edu-row, .value { break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>

const root = document.documentElement;
const $ = sel => document.querySelector(sel);
let lang = root.lang === 'en' ? 'en' : 'ko';

const t = v => (v == null ? '' : typeof v === 'string' ? v : (v[lang] ?? v.ko));
const now = new Date();
const monthIndex = s => { const [y, m] = s.split('-').map(Number); return y * 12 + (m - 1); };
const months = (start, end) => (end ? monthIndex(end) : now.getFullYear() * 12 + now.getMonth()) - monthIndex(start) + 1;
const totalMonths = () => DATA.companies.reduce((sum, c) => sum + months(c.start, c.end), 0);
const years = () => Math.floor(totalMonths() / 12);
const fill = s => s.replace(/\{years\}/g, years());
const fmtMonth = s => s.replace('-', '.');
const fmtPeriod = (s, e) => `${fmtMonth(s)} – ${e ? fmtMonth(e) : UI[lang].present}`;
const fmtDuration = m => {
  const y = Math.floor(m / 12), r = m % 12;
  const parts = lang === 'ko'
    ? [y && `${y}년`, r && `${r}개월`]
    : [y && `${y} ${y === 1 ? 'yr' : 'yrs'}`, r && `${r} ${r === 1 ? 'mo' : 'mos'}`];
  return parts.filter(Boolean).join(' ');
};
const sectionHead = (key, extra = '') => `
  <p class="section-label">0${['about', 'skills', 'experience', 'education'].indexOf(key) + 1} — ${key}</p>
  <h2 class="section-title">${UI[lang].titles[key]}${extra}</h2>`;

const save = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };

function setLang(next) {
  if (next === lang) return;
  lang = next;
  root.lang = next;
  save('lang', next);
  try {
    const url = new URL(location.href);
    url.searchParams.set('lang', next);
    history.replaceState(null, '', url);
  } catch (e) {}
  renderAll();
  observeSections();
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('#theme-btn').addEventListener('click', () => {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  save('theme', next);
  renderThemeButton();
});

// 스크롤 위치에 맞춰 상단 메뉴 강조
let sectionObserver;
function observeSections() {
  if (!('IntersectionObserver' in window)) return;
  if (sectionObserver) sectionObserver.disconnect();
  sectionObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.k === entry.target.id));
    });
  }, { rootMargin: '-35% 0px -60% 0px' });
  document.querySelectorAll('main .section').forEach(s => sectionObserver.observe(s));
}

renderAll();
observeSections();
</script>
</body>
</html>
