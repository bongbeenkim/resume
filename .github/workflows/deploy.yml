# index.html 을 올리면 PDF(국문·영문)를 새로 만들어 사이트와 함께 배포한다.
# Settings → Pages → Source 를 "GitHub Actions" 로 두어야 동작한다.
name: Build PDF & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Build PDFs
        run: |
          for l in ko en; do
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --no-pdf-header-footer --virtual-time-budget=15000 \
              --print-to-pdf="resume-$l.pdf" \
              "file://$PWD/index.html?lang=$l"
          done
          ls -l resume-*.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
